name: HTML Project CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate-html:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install HTMLHint
      run: |
        npm install -g htmlhint

    - name: Run HTML Linter
      run: |
        htmlhint "**/*.html"
